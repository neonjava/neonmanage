name: Java CI with Maven

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: NeonCoreManage-Jar
        path: ../output_jars/*.jar

    - name: Discord Webhook Notification
      if: always()
      run: |
        STATUS="${{ job.status }}"
        COLOR=3066993
        if [ "$STATUS" = "success" ]; then
          COLOR=3066993
        elif [ "$STATUS" = "failure" ]; then
          COLOR=15158332
        fi
        
        MESSAGE="**Repo:** \`${{ github.repository }}\` \n**Branch:** \`${{ github.ref_name }}\` \n**Commit:** [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) - \`${{ github.event.head_commit.message }}\` \n**Author:** \`${{ github.event.head_commit.author.name }}\` \n**Build Status:** **${STATUS^^}**"
        ESCAPED_MESSAGE=$(echo "$MESSAGE" | sed 's/"/\\"/g' | awk '{printf "%s\\n", $0}' | sed 's/\\n$//')
        
        curl -H "Content-Type: application/json" \
             -d "{\"embeds\": [{\"title\": \"GitHub Actions Build Notification\", \"description\": \"$ESCAPED_MESSAGE\", \"color\": $COLOR}]}" \
             "REDACTED_WEBHOOK_URL"
