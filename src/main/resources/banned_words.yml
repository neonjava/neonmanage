# Spam detection settings
chat-filter:
  # How many characters should be similar to consider as spam (0-100, higher = stricter)
  similarity-threshold: 70
  # Cooldown in seconds between messages for spam detection
  cooldown-seconds: 1
  # How many repeated similar messages before block (0 = block on first)
  repeat-count: 2
  # Chat delay in seconds - players must wait this long between messages
  chat-delay-seconds: 2

spam:
  # How many characters should be similar to consider as spam (0-100, higher = stricter)
  similarity-threshold: 70
  # Cooldown in seconds between messages
  cooldown-seconds: 1
  # How many repeated similar messages before warn (0 = warn on first)
  repeat-count: 2
