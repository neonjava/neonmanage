# NeonCoreManage Configuration

modules:
  god: true          # Toggle /god command
  time: true         # Toggle /day, /night, /noon commands
  moderation: true   # Toggle /ban, /tempban, /banip, /mute, /unmute, etc.
  chat-bridge: true  # Toggle sending chat messages to Discord
  heal: true         # Toggle /heal command
  teleport: true     # Toggle /tpa, /tpahere, /tpaccept, /tpdeny, /tpatoggle commands
  broadcast: true    # Toggle /broadcast command
  ignore: true       # Toggle /ignore command

discord:
  # Webhook URL for moderation logs (bans, mutes, unbans, unmutes, giverank)
  moderation-webhook-url: "REDACTED_WEBHOOK_URL"
  
  # Webhook URL for ingame chat to discord bridge
  chat-bridge-webhook-url: "REDACTED_WEBHOOK_URL"
  
  # Format of the chat message to send to Discord
  chat-bridge-format: "%player%: %message%"

teleport:
  # Teleport delay in seconds before teleporting (set to 0 for instant teleport)
  delay: 3

broadcast:
  prefix: "<red><bold>[ALERT]</bold></red> "
