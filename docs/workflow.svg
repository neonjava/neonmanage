<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-label="Workflow for NeonManage: Staff enters a command, Plugin checks permission, Server action is applied, Changes are saved">
<title>NeonManage workflow</title><desc>Staff enters a command → Plugin checks permission → Server action is applied → Changes are saved</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091322"/><stop offset="1" stop-color="#111a2c"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#a6d780" stop-opacity=".22"/><stop offset="1" stop-color="#a6d780" stop-opacity="0"/></radialGradient>
</defs>
<style>
text { font-family: Inter, Arial, sans-serif; }
.flow { animation: move 1.2s linear infinite; }
.beacon { animation: pulse 2.2s ease-in-out infinite; }
@keyframes move { to { stroke-dashoffset: -20; } }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .flow,.beacon { animation: none; } }
</style>
<rect width="1200" height="410" rx="24" fill="url(#bg)"/>
<circle cx="1100" cy="0" r="270" fill="url(#glow)"/>
<circle cx="0" cy="410" r="180" fill="url(#glow)" opacity=".4"/>
<text x="34" y="42" fill="#a6d780" font-size="12" font-weight="700" letter-spacing="3">HOW IT WORKS</text>
<text x="34" y="83" fill="#f3f6fb" font-size="31" font-weight="700">NeonManage</text>
<rect x="925" y="38" width="240" height="36" rx="18" fill="#19273b" stroke="#33455d"/>
<circle class="beacon" cx="946" cy="56" r="5" fill="#a6d780"/>
<text x="963" y="61" fill="#c9d7e7" font-size="14">Minecraft plugin</text>
<path d="M290 220 H326" stroke="#a6d780" stroke-width="2" stroke-dasharray="5 5" class="flow"/>
          <path d="m319 214 7 6-7 6" fill="none" stroke="#a6d780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M584 220 H620" stroke="#a6d780" stroke-width="2" stroke-dasharray="5 5" class="flow"/>
          <path d="m613 214 7 6-7 6" fill="none" stroke="#a6d780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M878 220 H914" stroke="#a6d780" stroke-width="2" stroke-dasharray="5 5" class="flow"/>
          <path d="m907 214 7 6-7 6" fill="none" stroke="#a6d780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g class="card c0" aria-label="Step 1: Staff enters a command">
          <rect x="32" y="112" width="258" height="218" rx="22" fill="#111d31" stroke="#324259" stroke-width="1.5"/>
          <rect x="33" y="113" width="256" height="5" rx="3" fill="#a6d780" opacity=".9"/>
          <circle cx="81" cy="167" r="32" fill="#a6d780" opacity=".13"/>
          <g transform="translate(57 143)" fill="none" stroke="#a6d780" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="36" height="36" rx="5"/><path d="M13 16h22M13 24h22M13 32h14"/></g>
          <text x="253" y="159" text-anchor="end" fill="#8090a7" font-size="15" font-weight="700">01</text>
          <text x="54" y="238" fill="#f2f6fc" font-size="20" font-weight="650"><tspan x="54" dy="0">Staff enters a</tspan><tspan x="54" dy="26">command</tspan></text>
          <rect x="54" y="300" width="117" height="1" fill="#a6d780" opacity=".65"/>
          <text x="54" y="316" fill="#9aaec5" font-size="11" font-weight="700" letter-spacing="2">INPUT</text>
        </g><g class="card c1" aria-label="Step 2: Plugin checks permission">
          <rect x="326" y="112" width="258" height="218" rx="22" fill="#111d31" stroke="#324259" stroke-width="1.5"/>
          <rect x="327" y="113" width="256" height="5" rx="3" fill="#a6d780" opacity=".9"/>
          <circle cx="375" cy="167" r="32" fill="#a6d780" opacity=".13"/>
          <g transform="translate(351 143)" fill="none" stroke="#a6d780" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 4 39 10v11c0 10-6 17-15 22C15 38 9 31 9 21V10z"/><path d="m17 24 5 5 10-11"/></g>
          <text x="547" y="159" text-anchor="end" fill="#8090a7" font-size="15" font-weight="700">02</text>
          <text x="348" y="238" fill="#f2f6fc" font-size="20" font-weight="650"><tspan x="348" dy="0">Plugin checks</tspan><tspan x="348" dy="26">permission</tspan></text>
          <rect x="348" y="300" width="135" height="1" fill="#a6d780" opacity=".65"/>
          <text x="348" y="316" fill="#9aaec5" font-size="11" font-weight="700" letter-spacing="2">PROCESS</text>
        </g><g class="card c2" aria-label="Step 3: Server action is applied">
          <rect x="620" y="112" width="258" height="218" rx="22" fill="#111d31" stroke="#324259" stroke-width="1.5"/>
          <rect x="621" y="113" width="256" height="5" rx="3" fill="#a6d780" opacity=".9"/>
          <circle cx="669" cy="167" r="32" fill="#a6d780" opacity=".13"/>
          <g transform="translate(645 143)" fill="none" stroke="#a6d780" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 38 31 17M27 8c9-7 16 0 13 8l-7-4-5 6M8 36l4 4"/></g>
          <text x="841" y="159" text-anchor="end" fill="#8090a7" font-size="15" font-weight="700">03</text>
          <text x="642" y="238" fill="#f2f6fc" font-size="20" font-weight="650"><tspan x="642" dy="0">Server action is</tspan><tspan x="642" dy="26">applied</tspan></text>
          <rect x="642" y="300" width="126" height="1" fill="#a6d780" opacity=".65"/>
          <text x="642" y="316" fill="#9aaec5" font-size="11" font-weight="700" letter-spacing="2">ACTION</text>
        </g><g class="card c3" aria-label="Step 4: Changes are saved">
          <rect x="914" y="112" width="258" height="218" rx="22" fill="#111d31" stroke="#324259" stroke-width="1.5"/>
          <rect x="915" y="113" width="256" height="5" rx="3" fill="#a6d780" opacity=".9"/>
          <circle cx="963" cy="167" r="32" fill="#a6d780" opacity=".13"/>
          <g transform="translate(939 143)" fill="none" stroke="#a6d780" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="10" rx="16" ry="6"/><path d="M8 10v26c0 8 32 8 32 0V10M8 22c0 8 32 8 32 0"/></g>
          <text x="1135" y="159" text-anchor="end" fill="#8090a7" font-size="15" font-weight="700">04</text>
          <text x="936" y="238" fill="#f2f6fc" font-size="20" font-weight="650"><tspan x="936" dy="0">Changes are saved</tspan></text>
          <rect x="936" y="300" width="126" height="1" fill="#a6d780" opacity=".65"/>
          <text x="936" y="316" fill="#9aaec5" font-size="11" font-weight="700" letter-spacing="2">RESULT</text>
        </g>
<path d="M34 364 H1166" stroke="#2c3b51" stroke-width="1"/>
<text x="34" y="387" fill="#91a4bb" font-size="13">01  START</text>
<text x="1062" y="387" fill="#a6d780" font-size="13" font-weight="700">04  RESULT</text>
</svg>
